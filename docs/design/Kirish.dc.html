<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..800;1,7..72,300..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="hisinf.css">
<script src="hisinf-fx.js"></script>
</helmet>
<div ref="{{ root }}" data-theme="{{ theme }}" style="position:relative;overflow:hidden;min-height:900px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background-color:var(--bg);background-image:var(--paper);color:var(--fg);font-family:'IBM Plex Sans',sans-serif">
  <div style="position:relative;border-right:1px solid var(--line);padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;background:var(--surface-2)">
    <a href="#home" style="display:flex;align-items:center;gap:12px;color:var(--fg)">
      <span style="position:relative;width:38px;height:38px;display:grid;place-items:center"><span style="position:absolute;inset:5px;border:1.5px solid var(--primary);transform:rotate(45deg)"></span><span style="position:absolute;inset:10px;border:1px solid var(--primary);transform:rotate(45deg)"></span><span style="position:relative;font:700 15px/1 Literata,serif;color:var(--primary)">H</span></span>
      <span style="font:600 24px/1 Literata,serif">hisinf<span style="color:var(--primary)">.uz</span></span>
    </a>
    <div style="position:relative;flex:1;min-height:420px;border:1px solid var(--line);padding:10px;background:var(--card);animation:hf-up .8s both">
      <div style="height:100%;box-sizing:border-box;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--ph) 0 1px,transparent 1px 8px),var(--surface-2);display:grid;place-items:center"><span style="font:500 11px/1.5 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:8px 12px;text-align:center">chiziqli gravyura<br>kutubxona · ochiq kitob</span></div>
      <div style="position:absolute;right:-20px;bottom:40px;width:110px;height:110px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;animation:hf-float 5s ease-in-out infinite"><div style="position:absolute;inset:7px;border-radius:50%;border:1px dashed var(--primary);animation:hf-spin 24s linear infinite"></div><span style="font:italic 500 15px/1.15 Literata,serif;text-align:center">Est.<br>2026</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;animation:hf-up .8s .15s both">
      <p style="margin:0;font:italic 400 30px/1.3 Literata,serif;max-width:22ch;text-wrap:balance">“Tarixni bilmagan xalq kelajakka ishonch bilan qaray olmaydi.”</p>
      <span style="font:500 11px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">— Xalq maqoli</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;padding:40px 48px">
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <div style="display:flex;border:1px solid var(--border);border-radius:999px;padding:3px;font:500 11.5px/1 'IBM Plex Mono'">
        <button onClick="{{ setUz }}" style="border:0;cursor:pointer;padding:8px 11px;border-radius:999px;font:inherit;background:{{ uzBg }};color:{{ uzFg }}">UZ</button>
        <button onClick="{{ setKaa }}" style="border:0;cursor:pointer;padding:8px 11px;border-radius:999px;font:inherit;background:{{ kaaBg }};color:{{ kaaFg }}">KAA</button>
      </div>
      <button onClick="{{ toggleTheme }}" aria-label="Tema" style="width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:transparent;cursor:pointer;transition:transform .5s" style-hover="transform:rotate(180deg)"><span style="width:15px;height:15px;border-radius:50%;border:1.5px solid var(--fg);background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)"></span></button>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center">
      <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:26px">
        <div style="position:relative;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;padding:4px">
          <span style="position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--fg);transform:translateX({{ pillX }});transition:transform .45s cubic-bezier(.2,.7,.2,1)"></span>
          <button onClick="{{ toIn }}" style="position:relative;border:0;background:transparent;padding:12px;font:500 14px 'IBM Plex Sans';color:{{ inFg }};cursor:pointer;transition:color .3s">{{ t.signin }}</button>
          <button onClick="{{ toUp }}" style="position:relative;border:0;background:transparent;padding:12px;font:500 14px 'IBM Plex Sans';color:{{ upFg }};cursor:pointer;transition:color .3s">{{ t.signup }}</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <h1 style="margin:0;font:400 48px/1.05 Literata,serif;letter-spacing:-.025em">{{ title }}</h1>
          <p style="margin:0;font:400 17px/1.5 Literata,serif;color:var(--muted)">{{ sub }}</p>
        </div>
        <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
          <div style="padding:18px 20px;border:1px solid var(--teal);background:var(--card);color:var(--teal);font-size:15px;animation:hf-up .4s both">✓ {{ doneMsg }}</div>
        </sc-if>
        <div style="display:flex;flex-direction:column;gap:16px">
          <sc-if value="{{ isUp }}" hint-placeholder-val="{{ false }}">
            <label style="display:flex;flex-direction:column;gap:7px;animation:hf-up .4s both"><span style="font:500 11px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">{{ t.name }}</span>
              <input value="{{ name }}" onInput="{{ onName }}" placeholder="Ism Familiya" style="border:1px solid var(--border);border-radius:8px;background:var(--card);padding:14px 16px;font:400 16px 'IBM Plex Sans';color:var(--fg);outline:0;transition:border-color .2s,box-shadow .2s" style-focus="border-color:var(--line);box-shadow:0 0 0 3px var(--ph)"></label>
          </sc-if>
          <label style="display:flex;flex-direction:column;gap:7px"><span style="font:500 11px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">{{ t.email }}</span>
            <input value="{{ email }}" onInput="{{ onEmail }}" placeholder="email@manzil.uz" style="border:1px solid {{ emailBd }};border-radius:8px;background:var(--card);padding:14px 16px;font:400 16px 'IBM Plex Sans';color:var(--fg);outline:0;transition:border-color .2s,box-shadow .2s" style-focus="box-shadow:0 0 0 3px var(--ph)">
            <sc-if value="{{ emailErr }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:var(--primary)">{{ t.emailErr }}</span></sc-if>
          </label>
          <label style="display:flex;flex-direction:column;gap:7px"><span style="display:flex;justify-content:space-between;font:500 11px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">{{ t.pass }}<sc-if value="{{ isIn }}" hint-placeholder-val="{{ true }}"><a href="#" style="text-transform:none;letter-spacing:0;font-family:'IBM Plex Sans';font-size:13px">{{ t.forgot }}</a></sc-if></span>
            <div style="display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;background:var(--card);padding-right:6px">
              <input type="{{ passType }}" value="{{ pass }}" onInput="{{ onPass }}" placeholder="••••••••" style="flex:1;min-width:0;border:0;background:transparent;padding:14px 16px;font:400 16px 'IBM Plex Sans';color:var(--fg);outline:0">
              <button onClick="{{ togglePass }}" style="border:0;background:transparent;color:var(--muted);font:500 12px 'IBM Plex Mono';cursor:pointer;padding:8px">{{ passLbl }}</button>
            </div>
            <sc-if value="{{ isUp }}" hint-placeholder-val="{{ false }}">
              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px"><sc-for list="{{ strength }}" as="b" hint-placeholder-count="4"><span style="height:3px;border-radius:2px;background:{{ b.c }};transition:background-color .3s"></span></sc-for></div>
            </sc-if>
          </label>
          <sc-if value="{{ isUp }}" hint-placeholder-val="{{ false }}">
            <label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--muted);cursor:pointer"><input type="checkbox" checked="{{ agree }}" onChange="{{ onAgree }}" style="margin-top:4px;accent-color:var(--primary)">{{ t.agree }}</label>
          </sc-if>
        </div>
        <button onClick="{{ submit }}" style="display:flex;justify-content:center;align-items:center;gap:10px;padding:17px;border:0;border-radius:999px;background:var(--primary);color:var(--primary-fg);font:500 16px 'IBM Plex Sans';cursor:pointer;box-shadow:0 4px 0 var(--fg);transition:transform .2s,box-shadow .2s" style-hover="transform:translateY(2px);box-shadow:0 2px 0 var(--fg)" style-active="transform:translateY(4px);box-shadow:0 0 0 var(--fg)">{{ cta }} <span style="font-family:'IBM Plex Mono'">→</span></button>
        <div style="display:flex;align-items:center;gap:14px;font:500 11px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--muted)"><span style="flex:1;height:1px;background:var(--border)"></span>{{ t.or }}<span style="flex:1;height:1px;background:var(--border)"></span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button style="display:flex;justify-content:center;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);font:500 14px 'IBM Plex Sans';cursor:pointer;transition:background-color .2s" style-hover="background-color:var(--card)"><span style="width:20px;height:20px;border-radius:50%;background:#2aa3df;color:#fff;display:grid;place-items:center;font:600 10px 'IBM Plex Mono'">T</span>Telegram</button>
          <button style="display:flex;justify-content:center;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);font:500 14px 'IBM Plex Sans';cursor:pointer;transition:background-color .2s" style-hover="background-color:var(--card)"><span style="width:20px;height:20px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;font:600 10px 'IBM Plex Mono'">G</span>Google</button>
        </div>
        <p style="margin:0;text-align:center;font-size:14px;color:var(--muted)">{{ switchText }} <button onClick="{{ switchMode }}" style="border:0;background:transparent;color:var(--primary);font:500 14px 'IBM Plex Sans';cursor:pointer;padding:0;text-decoration:underline">{{ switchLink }}</button></p>
      </div>
    </div>
    <span style="font:400 12px 'IBM Plex Mono';color:var(--muted);text-align:center">{{ t.note }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;in&quot;,&quot;up&quot;],&quot;default&quot;:&quot;in&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { theme: null, lang: 'uz', mode: null, name: '', email: '', pass: '', show: false, agree: true, tried: false, done: false };
  root = React.createRef();
  componentDidMount() { const go = (t = 0) => window.HFX ? window.HFX.cursor(this.root.current) : t < 40 && setTimeout(() => go(t + 1), 100); go(); }
  renderVals() {
    const s = this.state, kaa = s.lang === 'kaa', mode = s.mode || this.props.mode || 'in', up = mode === 'up';
    const t = kaa ? { signin:'Kiriw', signup:'Dizimnen ótiw', name:'Atı-familiyası', email:'Elektron pochta', pass:'Parol', forgot:'Paroldi umıttıńız ba?', agree:'Qaǵıydalar hám qupıyalıq siyasatı menen tanıstım', or:'yamasa', emailErr:'Durıs pochta mánzilin kiritiń', note:'Pikir qaldırıw ushın akkaunt kerek. Maqala jazıw — redaktor ruxsatı menen.' }
      : { signin:'Kirish', signup:'Roʻyxatdan oʻtish', name:'Ism-familiya', email:'Elektron pochta', pass:'Parol', forgot:'Parolni unutdingizmi?', agree:'Qoidalar va maxfiylik siyosati bilan tanishdim', or:'yoki', emailErr:'Toʻgʻri pochta manzilini kiriting', note:'Izoh qoldirish uchun akkaunt kerak. Maqola yozish — muharrir ruxsati bilan.' };
    const lvl = Math.min(4, (s.pass.length >= 6) + (s.pass.length >= 10) + /[0-9]/.test(s.pass) + /[A-Z!@#$%]/.test(s.pass));
    const cols = ['var(--primary)', 'var(--gold)', 'var(--gold)', 'var(--teal)'];
    const emailErr = s.tried && !/^\S+@\S+\.\S+$/.test(s.email);
    const on = 'var(--fg)';
    return {
      root: this.root, t, name: s.name, email: s.email, pass: s.pass, agree: s.agree,
      theme: s.theme || this.props.theme || 'light',
      toggleTheme: () => this.setState(x => ({ theme: (x.theme || this.props.theme || 'light') === 'dark' ? 'light' : 'dark' })),
      uzBg: kaa ? 'transparent' : on, uzFg: kaa ? 'var(--muted)' : 'var(--bg)', kaaBg: kaa ? on : 'transparent', kaaFg: kaa ? 'var(--bg)' : 'var(--muted)',
      setUz: () => this.setState({ lang: 'uz' }), setKaa: () => this.setState({ lang: 'kaa' }),
      isUp: up, isIn: !up,
      pillX: up ? '100%' : '0%', inFg: up ? 'var(--fg)' : 'var(--bg)', upFg: up ? 'var(--bg)' : 'var(--fg)',
      toIn: () => this.setState({ mode: 'in', done: false, tried: false }), toUp: () => this.setState({ mode: 'up', done: false, tried: false }),
      title: up ? (kaa ? 'Arxivke qosılıń' : 'Arxivga qoʻshiling') : (kaa ? 'Qaytqanıńız menen' : 'Xush kelibsiz'),
      sub: up ? (kaa ? 'Maqalalardı saqlań hám pikir qaldırıń.' : 'Maqolalarni saqlang va izoh qoldiring.') : (kaa ? 'Akkauntıńızǵa kiriń.' : 'Akkauntingizga kiring.'),
      cta: up ? t.signup : t.signin,
      onName: e => this.setState({ name: e.target.value }), onEmail: e => this.setState({ email: e.target.value }), onPass: e => this.setState({ pass: e.target.value }),
      onAgree: e => this.setState({ agree: e.target.checked }),
      emailErr, emailBd: emailErr ? 'var(--primary)' : 'var(--border)',
      passType: s.show ? 'text' : 'password', passLbl: s.show ? (kaa ? 'JASIRIW' : 'YASHIRISH') : (kaa ? 'KÓRSETIW' : 'KOʻRSATISH'),
      togglePass: () => this.setState(x => ({ show: !x.show })),
      strength: [0, 1, 2, 3].map(i => ({ c: i < lvl ? cols[lvl - 1] : 'var(--border)' })),
      submit: () => { const ok = /^\S+@\S+\.\S+$/.test(s.email) && s.pass.length > 0; this.setState({ tried: true, done: ok }); },
      done: s.done, doneMsg: up ? (kaa ? 'Akkaunt jaratıldı. Pochtańızdı tastıyıqlań.' : 'Akkaunt yaratildi. Pochtangizni tasdiqlang.') : (kaa ? 'Kirdińiz. Bas betke ótilmekte…' : 'Kirdingiz. Bosh sahifaga oʻtilmoqda…'),
      switchText: up ? (kaa ? 'Akkauntıńız bar ma?' : 'Akkauntingiz bormi?') : (kaa ? 'Akkauntıńız joq pa?' : 'Akkauntingiz yoʻqmi?'),
      switchLink: up ? t.signin : t.signup,
      switchMode: () => this.setState({ mode: up ? 'in' : 'up', done: false, tried: false }),
    };
  }
}
</script>
</body>
</html>
