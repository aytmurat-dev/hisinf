<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..800;1,7..72,300..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="hisinf.css">
<script src="hisinf-fx.js"></script>
</helmet>
<div ref="{{ root }}" data-theme="{{ theme }}" style="position:relative;overflow:hidden;background-color:var(--bg);background-image:var(--paper);color:var(--fg);font-family:'IBM Plex Sans',sans-serif">
  <dc-import name="SiteHeader" active="archive" lang="{{ lang }}" on-lang="{{ setLang }}" on-theme="{{ toggleTheme }}" hint-size="100%,112px"></dc-import>
  <section style="padding:72px 48px 36px;display:flex;justify-content:space-between;align-items:end;gap:32px;flex-wrap:wrap;border-bottom:1px solid var(--line)">
    <div style="display:flex;flex-direction:column;gap:18px">
      <span style="display:flex;align-items:center;gap:12px;font:500 12px 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--primary);animation:hf-up .6s both"><span style="width:28px;height:1px;background:currentColor"></span>{{ t.kicker }}</span>
      <h1 style="margin:0;font:400 clamp(56px,7vw,100px)/.95 Literata,serif;letter-spacing:-.04em;animation:hf-up .7s .08s both">{{ t.title }}</h1>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;animation:hf-up .7s .16s both">
      <sc-for list="{{ types }}" as="ty" hint-placeholder-count="5"><button onClick="{{ ty.pick }}" style="display:flex;gap:8px;align-items:center;padding:10px 16px;border:1px solid {{ ty.bd }};border-radius:999px;background:{{ ty.bg }};color:{{ ty.fg }};font:500 13.5px 'IBM Plex Sans';cursor:pointer;transition:all .2s" style-hover="border-color:var(--line)">{{ ty.label }}<span style="font:500 11px 'IBM Plex Mono';opacity:.6">{{ ty.n }}</span></button></sc-for>
    </div>
  </section>
  <section style="padding:40px 48px 112px;columns:4 260px;column-gap:24px">
    <sc-for list="{{ items }}" as="m" hint-placeholder-count="12">
      <button onClick="{{ m.open }}" data-curl="1" style="display:block;width:100%;break-inside:avoid;margin:0 0 24px;padding:8px 8px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-align:left;cursor:zoom-in;animation:hf-up .5s {{ m.d }}ms both;transition:transform .3s,box-shadow .3s" style-hover="transform:translateY(-4px);box-shadow:6px 6px 0 var(--fg)">
        <span style="position:relative;display:grid;place-items:center;height:{{ m.h }}px;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--ph) 0 1px,transparent 1px 8px),var(--surface-2)">
          <span style="font:500 10px 'IBM Plex Mono';text-transform:uppercase;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:5px 9px">{{ m.ph }}</span>
          <sc-if value="{{ m.video }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;width:52px;height:52px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:16px">▶</span></sc-if>
          <span style="position:absolute;left:8px;top:8px;padding:4px 8px;border-radius:999px;background:var(--bg);font:500 10px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--teal)">{{ m.type }}</span>
        </span>
        <span style="display:flex;flex-direction:column;gap:6px;padding:12px 6px 0"><span style="font:500 17px/1.3 Literata,serif">{{ m.title }}</span><span style="font:400 11.5px 'IBM Plex Mono';color:var(--muted)">{{ m.year }} · {{ m.src }}</span></span>
      </button>
    </sc-for>
  </section>
  <sc-if value="{{ cur }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:absolute;inset:0;z-index:50;background:rgba(15,10,6,.88);display:grid;grid-template-columns:80px minmax(0,1fr) 380px 80px;align-items:center;animation:hf-pop .25s both">
      <button onClick="{{ prev }}" style="justify-self:center;width:52px;height:52px;border:1px solid #ede4d3;border-radius:50%;background:transparent;color:#ede4d3;font:500 16px 'IBM Plex Mono';cursor:pointer">←</button>
      <div onClick="{{ stop }}" style="height:76vh;max-height:760px;border:1px solid #ede4d3;background:repeating-linear-gradient(135deg,rgba(237,228,211,.06) 0 1px,transparent 1px 8px),#2a221b;display:grid;place-items:center;animation:hf-up .35s both"><span style="font:500 11px 'IBM Plex Mono';text-transform:uppercase;color:#a89a86">{{ cur.ph }}</span></div>
      <div onClick="{{ stop }}" style="align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 32px;color:#ede4d3">
        <span style="font:500 11px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;color:#6fb1b5">{{ cur.type }} · {{ cur.idx }}</span>
        <span style="font:400 34px/1.15 Literata,serif">{{ cur.title }}</span>
        <span style="font:400 13px/1.7 'IBM Plex Mono';color:#a89a86">Yil: {{ cur.year }}<br>Manba: {{ cur.src }}<br>Litsenziya: CC BY-NC</span>
        <div style="display:flex;gap:8px;margin-top:8px"><a href="#maqola" style="padding:11px 16px;border-radius:999px;background:#d9785c;color:#1a120c;font-size:14px;font-weight:500">Maqolada koʻrish</a><button onClick="{{ close }}" style="padding:11px 16px;border:1px solid #ede4d3;border-radius:999px;background:transparent;color:#ede4d3;font:500 14px 'IBM Plex Sans';cursor:pointer">Yopish</button></div>
      </div>
      <button onClick="{{ next }}" style="justify-self:center;width:52px;height:52px;border:1px solid #ede4d3;border-radius:50%;background:transparent;color:#ede4d3;font:500 16px 'IBM Plex Mono';cursor:pointer">→</button>
    </div>
  </sc-if>
  <dc-import name="SiteFooter" lang="{{ lang }}" hint-size="100%,460px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const M = [
  ['Foto','Toʻrtkoʻl koʻchasi','1925','OʻzR MDA',300],['Hujjat','Qurultoy qarori','1925','OʻzR MDA',380],['Xarita','Xiva xonligi xaritasi','1873','RGVIA',240],
  ['Foto','Tuproqqalʼa qazishmasi','1946','S. Tolstov arxivi',220],['Video','Orol dengizi: 1960–2010','2010','Hujjatli film',260],['Gravyura','Xiva, Kalta minor','1880','V. Vereshchagin',340],
  ['Hujjat','Gandimiyon shartnomasi','1873','RGVIA',300],['Foto','Moʻynoq porti','1958','Nukus muzeyi',200],['Xarita','Chegaralanish xaritasi','1924','OʻzR MDA',280],
  ['Gravyura','Samarqand, Registon','1872','Turkiston albomi',240],['Foto','Jadid maktabi oʻquvchilari','1912','Turkiston albomi',320],['Video','Savitskiy muzeyi','2019','hisinf.uz',220],
];
class Component extends DCLogic {
  state = { theme: null, lang: 'uz', type: 'all', open: null };
  root = React.createRef();
  componentDidMount() { const go = (t = 0) => window.HFX ? window.HFX.all(this.root.current) : t < 40 && setTimeout(() => go(t + 1), 100); go(); }
  componentDidUpdate() { window.HFX && window.HFX.curl(this.root.current); }
  renderVals() {
    const s = this.state, kaa = s.lang === 'kaa';
    const t = kaa ? { kicker:'Fotosúwretler, hújjetler, kartalar', title:'Media arxiv' } : { kicker:'Fotosuratlar, hujjatlar, xaritalar', title:'Media arxiv' };
    const T = ['all', 'Foto', 'Hujjat', 'Xarita', 'Gravyura', 'Video'];
    const list = M.map((m, i) => ({ i, type: m[0], title: m[1], year: m[2], src: m[3], h: m[4] })).filter(m => s.type === 'all' || m.type === s.type);
    const pos = list.findIndex(m => m.i === s.open);
    const cur = pos >= 0 ? list[pos] : null;
    const step = d => () => this.setState({ open: list[(pos + d + list.length) % list.length].i });
    return {
      root: this.root, t, theme: s.theme || this.props.theme || 'light', lang: s.lang,
      setLang: l => this.setState({ lang: l }),
      toggleTheme: () => this.setState(x => ({ theme: (x.theme || this.props.theme || 'light') === 'dark' ? 'light' : 'dark' })),
      types: T.map(k => ({ label: k === 'all' ? 'Barchasi' : k, n: k === 'all' ? 1240 : { Foto: 612, Hujjat: 318, Xarita: 74, Gravyura: 156, Video: 80 }[k], bd: s.type === k ? 'var(--fg)' : 'var(--border)', bg: s.type === k ? 'var(--fg)' : 'transparent', fg: s.type === k ? 'var(--bg)' : 'var(--fg)', pick: () => this.setState({ type: k }) })),
      items: list.map((m, k) => ({ ...m, ph: m.type.toLowerCase() + ' · ' + m.year, video: m.type === 'Video', d: k * 50, open: () => this.setState({ open: m.i }) })),
      cur: cur && { ...cur, ph: cur.type.toLowerCase() + ' · ' + cur.year, idx: `${pos + 1} / ${list.length}` },
      close: () => this.setState({ open: null }), stop: e => e.stopPropagation(),
      prev: e => { e.stopPropagation(); step(-1)(); }, next: e => { e.stopPropagation(); step(1)(); },
    };
  }
}
</script>
</body>
</html>
