<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="hisinf.css">
</helmet>
<footer style="background:var(--fg);color:var(--bg);font-family:'IBM Plex Sans',sans-serif;padding:72px 48px 28px;position:relative;overflow:hidden">
  <div style="display:flex;align-items:center;gap:18px;margin-bottom:56px">
    <span style="flex:1;height:1px;background:currentColor;opacity:.3"></span>
    <span style="width:8px;height:8px;border:1px solid currentColor;transform:rotate(45deg);opacity:.6"></span>
    <span style="width:12px;height:12px;background:var(--primary);transform:rotate(45deg)"></span>
    <span style="width:8px;height:8px;border:1px solid currentColor;transform:rotate(45deg);opacity:.6"></span>
    <span style="flex:1;height:1px;background:currentColor;opacity:.3"></span>
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr)) minmax(0,1.4fr);gap:48px">
    <div style="display:flex;flex-direction:column;gap:18px">
      <span style="font:600 40px/1 Literata,serif;letter-spacing:-.02em">hisinf<span style="color:var(--primary)">.uz</span></span>
      <p style="margin:0;max-width:34ch;font:400 17px/1.55 Literata,serif;opacity:.82;text-wrap:pretty">{{ about }}</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;font-size:14.5px">
      <span style="font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:6px">{{ h1 }}</span>
      <sc-for list="{{ col1 }}" as="l" hint-placeholder-count="5"><a href="#" style="color:var(--bg);opacity:.85;transition:opacity .2s,transform .2s" style-hover="color:var(--bg);opacity:1;transform:translateX(4px)">{{ l }}</a></sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;font-size:14.5px">
      <span style="font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:6px">{{ h2 }}</span>
      <sc-for list="{{ col2 }}" as="l" hint-placeholder-count="5"><a href="#" style="color:var(--bg);opacity:.85;transition:opacity .2s,transform .2s" style-hover="color:var(--bg);opacity:1;transform:translateX(4px)">{{ l }}</a></sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <span style="font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.55">{{ h3 }}</span>
      <p style="margin:0;font-size:14.5px;line-height:1.55;opacity:.8">{{ subText }}</p>
      <div style="display:flex;border-bottom:1px solid currentColor;padding-bottom:6px">
        <input placeholder="email@manzil.uz" style="flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--bg);font:400 15px 'IBM Plex Sans';padding:8px 0">
        <button style="background:var(--primary);color:var(--primary-fg);border:0;border-radius:999px;padding:10px 16px;font:500 13px 'IBM Plex Sans';cursor:pointer;transition:transform .2s" style-hover="transform:translateX(3px)">{{ subBtn }} →</button>
      </div>
      <a href="#" style="display:flex;align-items:center;gap:10px;color:var(--bg);font-size:14px;margin-top:6px" style-hover="color:var(--bg)"><span style="width:28px;height:28px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font:500 10px 'IBM Plex Mono'">TG</span>@hisinf_uz</a>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:64px;padding-top:20px;border-top:1px solid rgba(127,127,127,.35);font:400 12px/1.4 'IBM Plex Mono',monospace;opacity:.6">
    <span>© 2026 hisinf.uz — {{ rights }}</span>
    <span>{{ note }}</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:480},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;uz&quot;,&quot;kaa&quot;],&quot;default&quot;:&quot;uz&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const kaa = this.props.lang === 'kaa';
    return kaa ? {
      about:'Mektep oqıwshıları hám oqıtıwshılar ushın tekserilgen tariyxıy maqalalar, dáwirler, shaxslar hám arxiv hújjetleri.',
      h1:'Bólimler', col1:['Maqalalar','Dáwirler','Xronologiya','Shaxslar','Media arxiv'],
      h2:'Joybar', col2:['Biz haqqımızda','Avtorlar','Avtor bolıw','Qupıyalıq siyasatı','Baylanıs'],
      h3:'Hápte dayjesti', subText:'Hár juma eń jaqsı maqalalar pochtańızǵa.', subBtn:'Jazılıw',
      rights:'Barlıq huqıqlar qorǵalǵan', note:'Hár bir maqala redaktor tekseriwinen ótedi'
    } : {
      about:'Maktab oʻquvchilari va oʻqituvchilar uchun tekshirilgan tarixiy maqolalar, davrlar, shaxslar va arxiv hujjatlari.',
      h1:'Boʻlimlar', col1:['Maqolalar','Davrlar','Xronologiya','Shaxslar','Media arxiv'],
      h2:'Loyiha', col2:['Biz haqimizda','Mualliflar','Muallif boʻlish','Maxfiylik siyosati','Aloqa'],
      h3:'Haftalik dayjest', subText:'Har juma eng yaxshi maqolalar pochtangizga.', subBtn:'Obuna',
      rights:'Barcha huquqlar himoyalangan', note:'Har bir maqola muharrir tekshiruvidan oʻtadi'
    };
  }
}
</script>
</body>
</html>
