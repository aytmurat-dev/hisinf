<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..800;1,7..72,300..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="hisinf.css">
</helmet>
<header style="position:relative;z-index:20;border-bottom:1px solid var(--line);background:var(--bg);font-family:'IBM Plex Sans',sans-serif;color:var(--fg)">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:7px 48px;border-bottom:1px solid var(--border);font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">
    <span>{{ tagline }}</span>
    <div style="display:flex;gap:20px;align-items:center">
      <span>{{ today }}</span>
      <span style="width:4px;height:4px;background:var(--ornament);transform:rotate(45deg)"></span>
      <span>{{ edition }}</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:32px;padding:18px 48px;flex-wrap:wrap">
    <a href="#home" style="display:flex;align-items:center;gap:12px;color:var(--fg)">
      <span style="position:relative;width:38px;height:38px;display:grid;place-items:center">
        <span style="position:absolute;inset:5px;border:1.5px solid var(--primary);transform:rotate(45deg)"></span>
        <span style="position:absolute;inset:10px;border:1px solid var(--primary);transform:rotate(45deg)"></span>
        <span style="position:relative;font:700 15px/1 Literata,serif;color:var(--primary)">H</span>
      </span>
      <span style="display:flex;flex-direction:column;gap:2px">
        <span style="font:600 24px/1 Literata,serif;letter-spacing:-.01em">hisinf<span style="color:var(--primary)">.uz</span></span>
        <span style="font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)">historical info</span>
      </span>
    </a>
    <nav style="display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" style="position:relative;padding:10px 14px;font-size:14.5px;font-weight:500;color:var(--fg);border-radius:2px;transition:background-color .2s" style-hover="background-color:var(--surface-2);color:var(--fg)">
          {{ n.label }}
          <sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;left:14px;right:14px;bottom:3px;height:2px;background:var(--primary);animation:hf-ink .5s ease both"></span>
          </sc-if>
        </a>
      </sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="#qidiruv" aria-label="Qidiruv" style="width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;color:var(--fg);transition:border-color .2s" style-hover="border-color:var(--line);color:var(--fg)">
        <span style="position:relative;width:14px;height:14px;border:1.6px solid currentColor;border-radius:50%;margin:-3px 0 0 -3px"><span style="position:absolute;width:7px;height:1.6px;background:currentColor;right:-6px;bottom:-3px;transform:rotate(45deg)"></span></span>
      </a>
      <div style="display:flex;border:1px solid var(--border);border-radius:999px;padding:3px;font:500 11.5px/1 'IBM Plex Mono',monospace">
        <button onClick="{{ setUz }}" style="border:0;cursor:pointer;padding:8px 11px;border-radius:999px;font:inherit;background:{{ uzBg }};color:{{ uzFg }};transition:all .25s">UZ</button>
        <button onClick="{{ setKaa }}" style="border:0;cursor:pointer;padding:8px 11px;border-radius:999px;font:inherit;background:{{ kaaBg }};color:{{ kaaFg }};transition:all .25s">KAA</button>
      </div>
      <button onClick="{{ onTheme }}" aria-label="Tema" style="width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:transparent;cursor:pointer;transition:transform .5s cubic-bezier(.2,.7,.2,1)" style-hover="transform:rotate(180deg)">
        <span style="width:16px;height:16px;border-radius:50%;border:1.5px solid var(--fg);background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)"></span>
      </button>
      <a href="#kirish" style="display:flex;align-items:center;gap:8px;padding:11px 18px;background:var(--fg);color:var(--bg);border-radius:999px;font-size:14px;font-weight:500;transition:transform .2s,box-shadow .2s" style-hover="color:var(--bg);transform:translateY(-2px);box-shadow:0 4px 0 var(--primary)">{{ signin }}<span style="font-family:'IBM Plex Mono'">→</span></a>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:130},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;posts&quot;,&quot;periods&quot;,&quot;persons&quot;,&quot;archive&quot;,&quot;map&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;uz&quot;,&quot;kaa&quot;],&quot;default&quot;:&quot;uz&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onLang&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(l:string)=&gt;void&quot;},&quot;onTheme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const kaa = this.props.lang === 'kaa';
    const L = kaa
      ? { home:'Bas bet', posts:'Maqalalar', periods:'Dáwirler', persons:'Shaxslar', archive:'Media arxiv', map:'Karta', signin:'Kiriw', tagline:'Ózbekstan hám Qaraqalpaqstan tariyxı', edition:'Tekserilgen maqalalar' }
      : { home:'Bosh sahifa', posts:'Maqolalar', periods:'Davrlar', persons:'Shaxslar', archive:'Media arxiv', map:'Xarita', signin:'Kirish', tagline:'Oʻzbekiston va Qoraqalpogʻiston tarixi', edition:'Tekshirilgan maqolalar' };
    const a = this.props.active;
    const keys = [['home','#home'],['posts','#maqolalar'],['periods','#xronologiya'],['persons','#shaxslar'],['archive','#arxiv'],['map','#xarita']];
    const on = 'var(--fg)', off = 'transparent';
    return {
      ...L,
      today: kaa ? '9-oktyabr, 2026' : '9-oktabr, 2026',
      nav: keys.map(([k, href]) => ({ label: L[k], href, on: a === k })),
      uzBg: kaa ? off : on, uzFg: kaa ? 'var(--muted)' : 'var(--bg)',
      kaaBg: kaa ? on : off, kaaFg: kaa ? 'var(--bg)' : 'var(--muted)',
      setUz: () => this.props.onLang && this.props.onLang('uz'),
      setKaa: () => this.props.onLang && this.props.onLang('kaa'),
      onTheme: () => this.props.onTheme && this.props.onTheme(),
    };
  }
}
</script>
</body>
</html>
